name: Release

# Triggered by a version tag (vX.Y.Z) pushed by release-plz,
# or manually via workflow_dispatch to re-publish an existing tag.
#
# Pipeline (parallel):
#   build          — one binary per platform, uploaded to the GitHub Release
#   build-deb      — amd64 + arm64 DEB packages
#   build-rpm      — Fedora RPM package
#
# After build-deb / build-rpm:
#   publish-apt     — signs + publishes an APT repo to gh-pages:/apt (aptly)
#   publish-rpm     — signs + publishes a DNF/YUM repo to gh-pages:/rpm (createrepo_c)
#
# After build:
#   update-pkgbuild — commits refreshed PKGBUILD to master,
#                     which triggers aur-publish.yml

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to re-publish (e.g. v0.11.0)"
        required: true

permissions:
  contents: read

jobs:
  # ── Platform binaries ─────────────────────────────────────────────────────

  build:
    name: Binary — ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: susshi
            asset_name: susshi-linux-x86_64
            openssl_mode: system
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: susshi
            asset_name: susshi-linux-x86_64-static
            openssl_mode: vendored
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: susshi
            asset_name: susshi-macos-intel
            openssl_mode: vendored
          - os: macos-14
            target: aarch64-apple-darwin
            binary_name: susshi
            asset_name: susshi-macos-apple-silicon
            openssl_mode: system
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary_name: susshi
            asset_name: susshi-linux-aarch64
            openssl_mode: system
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: susshi.exe
            asset_name: susshi-windows-x86_64.exe
            openssl_mode: system

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}

      - name: Install Linux build deps
        if: contains(matrix.target, 'unknown-linux')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
          if [[ "$TARGET" == *musl* ]]; then
            sudo apt-get install -y musl-tools
          fi

      - name: Install OpenSSL (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install openssl --no-progress -y
          $opensslDir = "C:\Program Files\OpenSSL-Win64"
          if (-not (Test-Path $opensslDir)) { $opensslDir = "C:\Program Files\OpenSSL" }
          echo "OPENSSL_DIR=$opensslDir" >> $env:GITHUB_ENV
          echo "OPENSSL_NO_VENDOR=1" >> $env:GITHUB_ENV

      - name: Build (system OpenSSL)
        if: matrix.openssl_mode == 'system'
        shell: bash
        env:
          OPENSSL_NO_VENDOR: "1"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (vendored OpenSSL)
        if: matrix.openssl_mode == 'vendored'
        shell: bash
        run: cargo build --release --features openssl-vendored --target ${{ matrix.target }}

      - name: Copy binary to release asset name
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} ${{ matrix.asset_name }}
          chmod +x ${{ matrix.asset_name }} || true

      - name: Upload to GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ matrix.asset_name }}
          asset_name: ${{ matrix.asset_name }}
          tag: ${{ github.event.inputs.tag || github.ref }}
          overwrite: true

  # ── DEB packages (amd64 + arm64) ─────────────────────────────────────────

  build-deb:
    name: DEB packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deb and cross
        run: |
          cargo install cargo-deb
          cargo install cross

      - name: Install system OpenSSL (amd64)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Build amd64 DEB
        env:
          OPENSSL_NO_VENDOR: "1"
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu
          cargo deb --no-build --target x86_64-unknown-linux-gnu

      - name: Build arm64 DEB (cross-compiled)
        run: |
          cross build --release --features openssl-vendored --target aarch64-unknown-linux-gnu
          cargo deb --no-build --target aarch64-unknown-linux-gnu

      - name: Smoke test (amd64)
        run: |
          sudo dpkg -i target/debian/susshi_*_amd64.deb
          susshi --version
          sudo dpkg -r susshi

      - name: Upload to GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/debian/susshi_*.deb
          file_glob: true
          tag: ${{ github.event.inputs.tag || github.ref }}
          overwrite: true

      - name: Upload DEBs as artifact (for APT repo publish)
        uses: actions/upload-artifact@v4
        with:
          name: debs
          path: target/debian/susshi_*.deb
          retention-days: 1

  # ── APT repository (gh-pages) ─────────────────────────────────────────────

  publish-apt:
    name: Publish APT repository
    runs-on: ubuntu-latest
    needs: [build-deb]
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Download DEBs
        uses: actions/download-artifact@v4
        with:
          name: debs
          path: debs

      - name: Install aptly and GPG
        run: |
          sudo apt-get update
          sudo apt-get install -y aptly gnupg

      - name: Import signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          echo "KEYID=$KEYID" >> "$GITHUB_ENV"

      - name: Checkout gh-pages /apt state
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages-checkout

      - name: Build APT repo with aptly
        run: |
          mkdir -p ~/.aptly
          if [ -d gh-pages-checkout/apt/db ]; then
            cp -r gh-pages-checkout/apt/db ~/.aptly/db
            cp -r gh-pages-checkout/apt/pool ~/.aptly/pool
          fi

          aptly repo create -distribution=stable -component=main susshi || true
          aptly repo add susshi debs/*.deb

          if aptly publish list | grep -q stable; then
            aptly publish update -gpg-key="$KEYID" -batch stable
          else
            aptly publish repo -gpg-key="$KEYID" -batch -distribution=stable susshi
          fi

      - name: Sync published repo into gh-pages
        run: |
          rm -rf gh-pages-checkout/apt
          mkdir -p gh-pages-checkout/apt
          cp -r ~/.aptly/public/* gh-pages-checkout/apt/
          mkdir -p gh-pages-checkout/apt/db gh-pages-checkout/apt/pool
          cp -r ~/.aptly/db/* gh-pages-checkout/apt/db/
          cp -r ~/.aptly/pool/* gh-pages-checkout/apt/pool/

      - name: Commit and push to gh-pages
        working-directory: gh-pages-checkout
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apt
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "chore(apt): publish $TAG"
          git push origin HEAD:gh-pages

  # ── RPM package (Fedora) ──────────────────────────────────────────────────

  build-rpm:
    name: RPM package (x86_64)
    runs-on: ubuntu-latest
    container: fedora:latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install build dependencies
        run: dnf install -y rust cargo openssl-devel zlib-devel pkgconf-pkg-config rpm-build rpmdevtools git

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            /github/home/.cargo/registry/index
            /github/home/.cargo/registry/cache
            /github/home/.cargo/git/db
            /github/home/cargo-target
          key: fedora-rpm-x86_64-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            fedora-rpm-x86_64-

      - name: Set up rpmbuild tree
        run: rpmdev-setuptree

      - name: Patch version in spec file
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          sed -i "s/^Version:.*/Version:        ${VERSION}/" susshi.spec

      - name: Fetch source archive
        run: spectool -g -R susshi.spec

      - name: Build RPM
        env:
          OPENSSL_NO_VENDOR: "1"
          LIBZ_SYS_USE_PKG_CONFIG: "1"
          CARGO_TARGET_DIR: /github/home/cargo-target
        run: rpmbuild -ba susshi.spec

      - name: Smoke test
        shell: bash
        run: |
          rpm_file=$(find /github/home/rpmbuild/RPMS -name "susshi-*.rpm" | grep -v debug | head -n1)
          dnf install -y "${rpm_file}"
          susshi --version
          rpm -e susshi

      - name: Upload to GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: /github/home/rpmbuild/RPMS/**/*.rpm
          file_glob: true
          tag: ${{ github.event.inputs.tag || github.ref }}
          overwrite: true

      - name: Collect RPM for artifact upload
        run: |
          mkdir -p rpms
          find /github/home/rpmbuild/RPMS -name "susshi-*.rpm" ! -name "*debuginfo*" ! -name "*debugsource*" -exec cp {} rpms/ \;

      - name: Upload RPM as artifact (for repo publish)
        uses: actions/upload-artifact@v4
        with:
          name: rpms
          path: rpms/*.rpm
          retention-days: 1

  # ── RPM repository (gh-pages) ───────────────────────────────────────────────

  publish-rpm:
    name: Publish RPM repository
    runs-on: ubuntu-latest
    needs: [build-rpm]
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Download RPMs
        uses: actions/download-artifact@v4
        with:
          name: rpms
          path: rpms

      - name: Install createrepo_c and GPG
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c gnupg rpm

      - name: Import signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          echo "KEYID=$KEYID" >> "$GITHUB_ENV"
          mkdir -p ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true

      - name: Checkout gh-pages /rpm state
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages-checkout

      - name: Sign RPMs
        run: |
          cat > ~/.rpmmacros <<EOF
          %_gpg_name $KEYID
          %__gpg_sign_cmd %{__gpg} gpg --batch --yes --no-armor --pinentry-mode loopback --digest-algo sha256 -u "%{_gpg_name}" -sbo %{__signature_filename} %{__plaintext_filename}
          EOF
          rpm --addsign rpms/*.rpm

      - name: Build repo with createrepo_c
        run: |
          rm -rf repo
          mkdir -p repo
          cp rpms/*.rpm repo/
          [ -d gh-pages-checkout/rpm/repodata ] && cp -r gh-pages-checkout/rpm/*.rpm repo/ 2>/dev/null || true
          createrepo_c repo
          gpg --batch --yes --detach-sign --armor repo/repodata/repomd.xml

      - name: Sync repo into gh-pages
        run: |
          rm -rf gh-pages-checkout/rpm
          mkdir -p gh-pages-checkout/rpm
          cp -r repo/* gh-pages-checkout/rpm/

      - name: Commit and push to gh-pages
        working-directory: gh-pages-checkout
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rpm
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "chore(rpm): publish $TAG"
          git push origin HEAD:gh-pages

  # ── Arch Linux PKGBUILD (committed to repo) ───────────────────────────────

  update-pkgbuild:
    name: Update PKGBUILD in repo
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          # PAT required so this push triggers aur-publish.yml.
          # GITHUB_TOKEN pushes are silently ignored by workflow event triggers.
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
          ref: master

      - name: Update PKGBUILD
        run: bash scripts/update-pkgbuild.sh

      - name: Regenerate .SRCINFO
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/pkg" \
            -w /pkg \
            archlinux:latest \
            bash -c "
              pacman -Sy --noconfirm base-devel > /dev/null 2>&1
              useradd -m builder
              chown -R builder:builder /pkg
              su builder -s /bin/bash -c 'cd /pkg && makepkg --printsrcinfo > /pkg/.SRCINFO'
            "

      - name: Fix workspace permissions after Docker
        run: sudo chown -R "$USER" .

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD PKGBUILD.bin .SRCINFO susshi.spec
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          git commit -m "chore(release): update PKGBUILD to v${VERSION}"
          git push

  # ── Cleanup stale release-plz branches ───────────────────────────────────

  cleanup-branches:
    name: Cleanup stale release-plz branches
    runs-on: ubuntu-latest
    needs: [update-pkgbuild]
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Delete closed release-plz branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/branches" --paginate \
            --jq '.[].name | select(startswith("release-plz-"))' \
          | while IFS= read -r branch; do
              open=$(gh pr list --head "$branch" --state open --json number --jq 'length')
              if [ "$open" = "0" ]; then
                if gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$branch" 2>/dev/null; then
                  echo "Deleted: $branch"
                fi
              fi
            done
