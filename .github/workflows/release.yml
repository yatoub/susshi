name: Release

# Triggered by a version tag (vX.Y.Z) pushed by release-plz,
# or manually via workflow_dispatch to re-publish an existing tag.
#
# Pipeline (parallel):
#   build          — one binary per platform, uploaded to the GitHub Release
#   build-deb      — amd64 + arm64 DEB packages
#   build-rpm      — Fedora RPM package
#
# After build-deb / build-rpm:
#   publish-apt     — signs + publishes an APT repo to gh-pages:/apt (aptly)
#   publish-rpm     — signs + publishes a DNF/YUM repo to gh-pages:/rpm (createrepo_c)
#
# After build:
#   update-pkgbuild — commits refreshed PKGBUILD to master,
#                     which triggers aur-publish.yml

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to re-publish (e.g. v0.11.0)"
        required: true

permissions:
  contents: read

# A manual re-publish (workflow_dispatch) could otherwise race the run
# triggered by the original tag push for the same tag.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # ── Platform binaries ─────────────────────────────────────────────────────

  build:
    name: Binary — ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on an older Ubuntu LTS (older glibc) so the resulting binary
          # runs on older distros too: glibc is forward-compatible only, so a
          # binary linked against ubuntu-latest's glibc (24.04 -> 2.39) fails
          # with "GLIBC_2.39 not found" on e.g. Debian 12 (glibc 2.36).
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary_name: susshi
            asset_name: susshi-linux-x86_64
            openssl_mode: system
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: susshi
            asset_name: susshi-linux-x86_64-static
            openssl_mode: vendored
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: susshi
            asset_name: susshi-macos-intel
            openssl_mode: vendored
          - os: macos-14
            target: aarch64-apple-darwin
            binary_name: susshi
            asset_name: susshi-macos-apple-silicon
            openssl_mode: system
          # Same glibc-compat reasoning as the x86_64-unknown-linux-gnu entry above.
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            binary_name: susshi
            asset_name: susshi-linux-aarch64
            openssl_mode: system
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: susshi.exe
            asset_name: susshi-windows-x86_64.exe
            openssl_mode: system

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        uses: ./.github/actions/build-target
        with:
          target: ${{ matrix.target }}
          openssl-mode: ${{ matrix.openssl_mode }}

      - name: Copy binary to release asset name
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} ${{ matrix.asset_name }}
          chmod +x ${{ matrix.asset_name }} || true

      - name: Upload to GitHub Release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de  # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ matrix.asset_name }}
          asset_name: ${{ matrix.asset_name }}
          tag: ${{ github.event.inputs.tag || github.ref }}
          overwrite: true

  # ── DEB packages (amd64 + arm64) ─────────────────────────────────────────

  build-deb:
    name: DEB packages
    # ubuntu-22.04 (older glibc) so the amd64 .deb runs on older glibc distros
    # (e.g. Debian 12 ships glibc 2.36, ubuntu-latest/24.04 links against 2.39).
    # The arm64 .deb is cross-compiled via `cross`'s own Docker image, so its
    # glibc baseline is unaffected by the host runner OS.
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deb and cross
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cross

      - name: Install system OpenSSL (amd64)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Build amd64 DEB
        env:
          OPENSSL_NO_VENDOR: "1"
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu
          cargo deb --no-build --target x86_64-unknown-linux-gnu

      - name: Build arm64 DEB (cross-compiled)
        run: |
          cross build --release --features openssl-vendored --target aarch64-unknown-linux-gnu
          cargo deb --no-build --target aarch64-unknown-linux-gnu

      - name: Smoke test (amd64)
        run: |
          sudo dpkg -i target/debian/susshi_*_amd64.deb
          susshi --version
          sudo dpkg -r susshi

      - name: Set up QEMU (for arm64 smoke test)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Smoke test (arm64, via QEMU)
        # Pinned by digest (debian:bookworm-slim as of this pin) for reproducibility.
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}/target/debian:/debs:ro" \
            debian@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818 \
            bash -c "apt-get update && apt-get install -y /debs/susshi_*_arm64.deb && susshi --version"

      - name: Upload to GitHub Release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de  # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/debian/susshi_*.deb
          file_glob: true
          tag: ${{ github.event.inputs.tag || github.ref }}
          overwrite: true

      - name: Upload DEBs as artifact (for APT repo publish)
        uses: actions/upload-artifact@v7
        with:
          name: debs
          path: target/debian/susshi_*.deb
          retention-days: 1

  # ── APT repository (gh-pages) ─────────────────────────────────────────────

  publish-apt:
    name: Publish APT repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-deb]
    # Also run on a manual re-publish (workflow_dispatch): that's precisely
    # how a broken .deb already served by the APT repo gets fixed.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # Shared with docs.yml (which also pushes to gh-pages) so a `git push`
    # here can never race a docs deploy at the git level.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
    steps:
      - name: Download DEBs
        uses: actions/download-artifact@v8.0.1  # pinned: v4 < 4.1.3 has GHSA-cxww-7g56-2vh6
        with:
          name: debs
          path: debs

      - name: Install aptly and GPG
        # aptly version pinned: its -force-replace/-force-overwrite semantics
        # (relied on by the publish step below) were discovered the hard way —
        # an unpinned apt-get upgrade could silently change that behavior again.
        run: |
          sudo apt-get update
          sudo apt-get install -y aptly=1.5.0+ds1-2ubuntu0.24.04.3 gnupg

      - name: Import signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          echo "KEYID=$KEYID" >> "$GITHUB_ENV"

      - name: Checkout gh-pages /apt state
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages-checkout

      - name: Build APT repo with aptly
        run: |
          mkdir -p ~/.aptly
          # aptly's internal state (repo db + its own content-addressed package
          # pool) lives under apt/_state/, separate from apt/dists and apt/pool
          # (the tree actually served to apt clients, regenerated fresh below).
          # They must never share a directory: merging them here and copying
          # the merged tree back at the end of the job would silently
          # re-overwrite the freshly published pool/ file with a stale one on
          # every subsequent run, regardless of any aptly -force-* flag.
          if [ -d gh-pages-checkout/apt/_state/db ]; then
            cp -r gh-pages-checkout/apt/_state/db ~/.aptly/db
            cp -r gh-pages-checkout/apt/_state/pool ~/.aptly/pool
          fi

          aptly repo create -distribution=stable -component=main susshi || true
          # -force-replace: re-publishing the same version (e.g. a workflow_dispatch
          # re-run to fix a broken build) must overwrite the existing package
          # instead of erroring out with "conflict in package".
          aptly repo add -force-replace susshi debs/*.deb

          if aptly publish list | grep -q stable; then
            # -force-overwrite: repo add -force-replace only swaps the package in
            # aptly's local repo metadata. Without this flag, `publish update` still
            # leaves the already-published pool/ file untouched when the
            # version+arch key is unchanged, silently serving stale package bytes
            # even though the Packages index now describes the new one.
            aptly publish update -force-overwrite -gpg-key="$KEYID" -batch stable
          else
            aptly publish repo -gpg-key="$KEYID" -batch -distribution=stable susshi
          fi

      - name: Sync published repo into gh-pages
        run: |
          rm -rf gh-pages-checkout/apt
          mkdir -p gh-pages-checkout/apt gh-pages-checkout/apt/_state
          cp -r ~/.aptly/public/* gh-pages-checkout/apt/
          cp -r ~/.aptly/db gh-pages-checkout/apt/_state/db
          cp -r ~/.aptly/pool gh-pages-checkout/apt/_state/pool

      - name: Commit and push to gh-pages
        working-directory: gh-pages-checkout
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apt
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "chore(apt): publish $TAG"
          git push origin HEAD:gh-pages

      - name: Notify on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "APT repo publish failed for $TAG" \
            --label "ci-failure" \
            --body "publish-apt failed on release $TAG. Run: $RUN_URL"

  # ── APT repo smoke test ───────────────────────────────────────────────────
  #
  # Verifies a real client can install from the just-published repo, not just
  # that `git push` succeeded. This class of bug (wrong glibc baseline, a
  # stale pool/ file never actually refreshed, a missing runtime dependency)
  # previously only surfaced when someone manually tested `apt install` on a
  # VM after the fact. GitHub Pages/its CDN can take a few minutes to fully
  # propagate a push, so installation is retried with backoff before failing.

  smoke-test-apt:
    name: Smoke test — apt install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [publish-apt]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Install susshi from the published APT repo (retry for CDN propagation delay)
        run: |
          cat > smoke-test.sh <<'SCRIPT'
          set -e
          apt-get update
          apt-get install -y curl gnupg
          curl -fsSL https://yatoub.github.io/susshi/apt-pubkey.asc | gpg --dearmor -o /usr/share/keyrings/susshi.gpg
          echo "deb [signed-by=/usr/share/keyrings/susshi.gpg] https://yatoub.github.io/susshi/apt stable main" > /etc/apt/sources.list.d/susshi.list
          apt-get update
          apt-get install -y susshi
          susshi --version
          SCRIPT

          for attempt in 1 2 3 4 5; do
            if docker run --rm \
                -v "${{ github.workspace }}/smoke-test.sh:/smoke-test.sh:ro" \
                debian@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818 \
                bash /smoke-test.sh; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 60s..."
            sleep 60
          done
          echo "::error::susshi failed to install from the APT repo after 5 attempts"
          exit 1

      - name: Notify on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "APT repo smoke test failed for $TAG" \
            --label "ci-failure" \
            --body "A fresh 'apt install susshi' from the published repo failed for $TAG. Run: $RUN_URL"

  # ── RPM package (Fedora) ──────────────────────────────────────────────────

  build-rpm:
    name: RPM package (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: fedora:41
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install build dependencies
        run: dnf install -y rust cargo openssl-devel zlib-devel pkgconf-pkg-config rpm-build rpmdevtools git

      # Only the Cargo registry is cached, not the build's target/ dir: build.rs
      # writes the man page to a path relative to the source checkout (not
      # CARGO_TARGET_DIR), which rpmbuild re-extracts fresh on every run at a
      # deterministic path. Caching target/ across runs let cargo see a fingerprint
      # match and skip re-running build.rs, silently omitting the man page from
      # the fresh checkout (surfaced when re-running release.yml for the same tag
      # with an unchanged Cargo.lock — an exact cache-key hit).
      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            /github/home/.cargo/registry/index
            /github/home/.cargo/registry/cache
            /github/home/.cargo/git/db
          key: fedora-rpm-x86_64-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            fedora-rpm-x86_64-

      - name: Set up rpmbuild tree
        run: rpmdev-setuptree

      - name: Patch version in spec file
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          sed -i "s/^Version:.*/Version:        ${VERSION}/" susshi.spec

      - name: Fetch source archive
        run: spectool -g -R susshi.spec

      - name: Build RPM
        env:
          OPENSSL_NO_VENDOR: "1"
          LIBZ_SYS_USE_PKG_CONFIG: "1"
        run: rpmbuild -ba susshi.spec

      - name: Smoke test
        shell: bash
        run: |
          rpm_file=$(find /github/home/rpmbuild/RPMS -name "susshi-*.rpm" | grep -v debug | head -n1)
          dnf install -y "${rpm_file}"
          susshi --version
          rpm -e susshi

      - name: Upload to GitHub Release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de  # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: /github/home/rpmbuild/RPMS/**/*.rpm
          file_glob: true
          tag: ${{ github.event.inputs.tag || github.ref }}
          overwrite: true

      - name: Collect RPM for artifact upload
        run: |
          mkdir -p rpms
          find /github/home/rpmbuild/RPMS -name "susshi-*.rpm" ! -name "*debuginfo*" ! -name "*debugsource*" -exec cp {} rpms/ \;

      - name: Upload RPM as artifact (for repo publish)
        uses: actions/upload-artifact@v7
        with:
          name: rpms
          path: rpms/*.rpm
          retention-days: 1

  # ── RPM repository (gh-pages) ───────────────────────────────────────────────

  publish-rpm:
    name: Publish RPM repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-rpm]
    # Also run on a manual re-publish (workflow_dispatch): that's precisely
    # how a broken RPM already served by the repo gets fixed.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # Shared with docs.yml and publish-apt (all push to gh-pages) so a
    # `git push` here can never race another writer at the git level.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
    steps:
      - name: Download RPMs
        uses: actions/download-artifact@v8.0.1  # pinned: v4 < 4.1.3 has GHSA-cxww-7g56-2vh6
        with:
          name: rpms
          path: rpms

      - name: Install createrepo_c and GPG
        # createrepo-c version pinned to avoid silent behavior drift, same
        # reasoning as aptly's pin in publish-apt.
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c=0.17.3-2ubuntu3 gnupg rpm

      - name: Import signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          echo "KEYID=$KEYID" >> "$GITHUB_ENV"
          mkdir -p ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true

      - name: Checkout gh-pages /rpm state
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages-checkout

      - name: Sign RPMs
        run: |
          cat > ~/.rpmmacros <<EOF
          %_gpg_name $KEYID
          %__gpg_sign_cmd %{__gpg} gpg --batch --yes --no-armor --pinentry-mode loopback --digest-algo sha256 -u "%{_gpg_name}" -sbo %{__signature_filename} %{__plaintext_filename}
          EOF
          rpm --addsign rpms/*.rpm

      - name: Build repo with createrepo_c
        run: |
          rm -rf repo
          mkdir -p repo
          cp rpms/*.rpm repo/
          [ -d gh-pages-checkout/rpm/repodata ] && cp -r gh-pages-checkout/rpm/*.rpm repo/ 2>/dev/null || true
          createrepo_c repo
          gpg --batch --yes --detach-sign --armor repo/repodata/repomd.xml

      - name: Sync repo into gh-pages
        run: |
          rm -rf gh-pages-checkout/rpm
          mkdir -p gh-pages-checkout/rpm
          cp -r repo/* gh-pages-checkout/rpm/

      - name: Commit and push to gh-pages
        working-directory: gh-pages-checkout
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rpm
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "chore(rpm): publish $TAG"
          git push origin HEAD:gh-pages

      - name: Notify on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "RPM repo publish failed for $TAG" \
            --label "ci-failure" \
            --body "publish-rpm failed on release $TAG. Run: $RUN_URL"

  # ── RPM repo smoke test ───────────────────────────────────────────────────
  # Same rationale as smoke-test-apt above.

  smoke-test-rpm:
    name: Smoke test — dnf install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [publish-rpm]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Install susshi from the published RPM repo (retry for CDN propagation delay)
        run: |
          cat > smoke-test.sh <<'SCRIPT'
          set -e
          cat > /etc/yum.repos.d/susshi.repo <<'REPO'
          [susshi]
          name=Susshi
          baseurl=https://yatoub.github.io/susshi/rpm
          enabled=1
          gpgcheck=1
          gpgkey=https://yatoub.github.io/susshi/apt-pubkey.asc
          REPO
          dnf install -y susshi
          susshi --version
          SCRIPT

          for attempt in 1 2 3 4 5; do
            if docker run --rm \
                -v "${{ github.workspace }}/smoke-test.sh:/smoke-test.sh:ro" \
                fedora:41 \
                bash /smoke-test.sh; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 60s..."
            sleep 60
          done
          echo "::error::susshi failed to install from the RPM repo after 5 attempts"
          exit 1

      - name: Notify on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "RPM repo smoke test failed for $TAG" \
            --label "ci-failure" \
            --body "A fresh 'dnf install susshi' from the published repo failed for $TAG. Run: $RUN_URL"

  # ── Arch Linux PKGBUILD (committed to repo) ───────────────────────────────

  update-pkgbuild:
    name: Update PKGBUILD in repo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    # Also run on a manual re-publish (workflow_dispatch): a re-publish can
    # rebuild binaries (overwrite: true on the upload step) without the
    # bytes being reproducible, which leaves PKGBUILD's checksums stale.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          # PAT required so this push triggers aur-publish.yml.
          # GITHUB_TOKEN pushes are silently ignored by workflow event triggers.
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
          ref: master

      - name: Update PKGBUILD
        run: bash scripts/update-pkgbuild.sh

      - name: Regenerate .SRCINFO
        # Pinned by digest (archlinux:latest as of this pin) so the base image
        # itself can't change unnoticed; `pacman -Sy` below still always pulls
        # current package versions from the mirrors regardless of this pin.
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/pkg" \
            -w /pkg \
            archlinux@sha256:fe6972d4dc1f660c0c10f4c41b2de8986bab89e7e2955378f8beadb8ebcd7433 \
            bash -c "
              pacman -Sy --noconfirm base-devel > /dev/null 2>&1
              useradd -m builder
              chown -R builder:builder /pkg
              su builder -s /bin/bash -c 'cd /pkg && makepkg --printsrcinfo > /pkg/.SRCINFO'
            "

      - name: Fix workspace permissions after Docker
        run: sudo chown -R "$USER" .

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD PKGBUILD.bin .SRCINFO susshi.spec
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          git commit -m "chore(release): update PKGBUILD to v${VERSION}"
          git push

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          github-token: ${{ github.token }}
          title: "PKGBUILD update failed for ${{ github.ref_name }}"
          body: "update-pkgbuild failed on release ${{ github.ref_name }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ── Cleanup stale release-plz branches ───────────────────────────────────

  cleanup-branches:
    name: Cleanup stale release-plz branches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [update-pkgbuild]
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Delete closed release-plz branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/branches" --paginate \
            --jq '.[].name | select(startswith("release-plz-"))' \
          | while IFS= read -r branch; do
              open=$(gh pr list --head "$branch" --state open --json number --jq 'length')
              if [ "$open" = "0" ]; then
                if gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$branch" 2>/dev/null; then
                  echo "Deleted: $branch"
                fi
              fi
            done
