name: Deploy Docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install MkDocs Material
        run: pip install mkdocs-material pillow cairosvg

      - name: Build site
        run: mkdocs build --site-dir _site

      # gh-pages also hosts the APT repo under /apt (published by release.yml),
      # so we sync the built docs in place instead of force-pushing the whole
      # branch, which would wipe it out.
      - name: Sync to gh-pages (preserve /apt)
        run: |
          git fetch origin gh-pages
          git worktree add gh-pages-checkout origin/gh-pages
          rsync -a --delete --exclude='/apt' --exclude='/.git' _site/ gh-pages-checkout/
          cd gh-pages-checkout
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi
          git commit -m "docs: deploy ${{ github.sha }}"
          git push origin HEAD:gh-pages
