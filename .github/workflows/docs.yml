name: Deploy Docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

# gh-pages is also written to by release.yml's publish-apt/publish-rpm jobs.
# All three share this group so a `git push origin HEAD:gh-pages` here can
# never race one of theirs (each syncs into its own subtree, but a
# concurrent push to the same branch/ref is still a real race at the git
# level).
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install MkDocs Material
        run: pip install mkdocs-material pillow cairosvg

      - name: Build site
        run: mkdocs build --site-dir _site

      # gh-pages also hosts the APT/RPM repos under /apt and /rpm (published
      # by release.yml), so we sync the built docs in place instead of
      # force-pushing the whole branch, which would wipe them out.
      - name: Sync to gh-pages (preserve /apt and /rpm)
        run: |
          git fetch origin gh-pages
          git worktree add gh-pages-checkout origin/gh-pages
          rsync -a --delete --exclude='/apt' --exclude='/rpm' --exclude='/.git' _site/ gh-pages-checkout/
          cd gh-pages-checkout
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi
          git commit -m "docs: deploy ${{ github.sha }}"
          git push origin HEAD:gh-pages
