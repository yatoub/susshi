name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - 'PKGBUILD'
      - 'PKGBUILD.bin'
      - '.SRCINFO'
  pull_request:
    branches: [master]

# Cancel any in-progress run for the same branch when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 0. Preflight ──────────────────────────────────────────────────────────
  #
  # Release-plz PRs only touch Cargo.toml (version) and CHANGELOG.md —
  # no code change, so running the full suite is wasteful.
  # Detection uses the branch name (release-plz-*) rather than the actor
  # login, because release-plz runs under a PAT and appears as the repo owner.
  # Skipped jobs satisfy branch protection rules (GitHub treats them as green).
  #
  # Pipeline for normal PRs / pushes to master:
  #  lint ─┐
  #  test ─┴→ coverage
  #         → cross-platform builds
  #
  # lint and test run in parallel — nothing structurally requires clippy to
  # finish before tests start; only the downstream gated jobs need both.
  # deny, msrv and megalinter run independently (orthogonal signal).
  # ─────────────────────────────────────────────────────────────────────────

  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - name: Detect release-plz PR
        id: gate
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$BRANCH" == release-plz-* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release-plz PR — CI skipped (version bump only, no code change)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 1. Quality gate ───────────────────────────────────────────────────────

  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [preflight]
    if: needs.preflight.outputs.skip != 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [preflight]
    if: needs.preflight.outputs.skip != 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --verbose

  # ── 2. Security + MSRV (independent) ─────────────────────────────────────

  deny:
    name: Security (cargo deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [preflight]
    if: needs.preflight.outputs.skip != 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [preflight]
    if: needs.preflight.outputs.skip != 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.88

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Check (MSRV)
        run: cargo +1.88 check --all-targets

  nix:
    name: Nix flake
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [preflight]
    if: needs.preflight.outputs.skip != 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Build package
        run: nix build --print-build-logs .

  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [preflight]
    if: needs.preflight.outputs.skip != 'true'
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run MegaLinter
        uses: oxsecurity/megalinter/flavors/rust@v9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 3. Coverage (gated on tests) ──────────────────────────────────────────

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [preflight, test, lint]
    if: needs.preflight.outputs.skip != 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        run: |
          cargo llvm-cov \
            --lcov \
            --output-path lcov.info \
            --ignore-filename-regex 'src/(ui/|main\.rs|i18n\.rs)'

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

  # ── 4. Cross-platform smoke builds (gated on tests) ───────────────────────

  cross-platform:
    name: Build — ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    needs: [preflight, test, lint]
    if: needs.preflight.outputs.skip != 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 (not -latest) to match release.yml's glibc-compat
          # build environment — see the comment there for why.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            openssl_mode: system
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            openssl_mode: vendored
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            openssl_mode: system
          - os: macos-latest
            target: x86_64-apple-darwin
            openssl_mode: vendored
          - os: macos-14
            target: aarch64-apple-darwin
            openssl_mode: system
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            openssl_mode: system

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        uses: ./.github/actions/build-target
        with:
          target: ${{ matrix.target }}
          openssl-mode: ${{ matrix.openssl_mode }}

      - name: Run tests (Linux native only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --verbose
