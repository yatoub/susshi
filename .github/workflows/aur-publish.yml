name: Publish to AUR

# Triggered explicitly by the Release workflow's update-pkgbuild job once it
# knows the tag being published (via `gh workflow run aur-publish.yml -f
# tag=...`), or manually via workflow_dispatch to re-publish an existing tag.
#
# Not triggered by the implicit `workflow_run` event: for a manual
# workflow_dispatch re-publish of Release, workflow_run.head_sha is just the
# branch tip at dispatch time (not the tagged commit), so resolving the tag
# by matching head_sha against remote tags fails for that case. Requiring an
# explicit tag input sidesteps that entirely.
#
# Updates two AUR packages in parallel:
#   susshi      — builds from the released source tarball
#   susshi-bin  — installs the pre-built susshi-linux-x86_64 binary

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.12.0)"
        required: true

permissions:
  contents: read

# A manual re-publish could otherwise race the run triggered by release.yml
# for the same tag.
concurrency:
  group: aur-publish-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  # ── susshi (source package) ───────────────────────────────────────────────

  aur-source:
    name: Publish susshi (source)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version to publish
        id: ver
        uses: ./.github/actions/resolve-release-tag
        with:
          input-tag: ${{ github.event.inputs.tag }}

      - name: Compute checksum of source archive
        id: checksum
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          curl -fsSL "https://github.com/yatoub/susshi/archive/refs/tags/${TAG}.tar.gz" -o archive.tar.gz
          echo "b2sum=$(b2sum archive.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Patch PKGBUILD
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          B2SUM: ${{ steps.checksum.outputs.b2sum }}
        run: |
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/^b2sums=(.*/b2sums=(${B2SUM})/" PKGBUILD

      - name: Push to AUR
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050  # v4.2.0
        with:
          pkgname: susshi
          pkgbuild: ./PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "chore: update to ${{ steps.ver.outputs.tag }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519
          allow_empty_commits: false

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          github-token: ${{ github.token }}
          title: "AUR publish (susshi) failed for ${{ steps.ver.outputs.tag || 'unknown' }}"
          body: "aur-source failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ── susshi-bin (pre-built binary package) ─────────────────────────────────

  aur-bin:
    name: Publish susshi-bin (pre-built)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version to publish
        id: ver
        uses: ./.github/actions/resolve-release-tag
        with:
          input-tag: ${{ github.event.inputs.tag }}

      - name: Compute checksums (source archive + Linux binary)
        id: checksums
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          curl -fsSL "https://github.com/yatoub/susshi/archive/refs/tags/${TAG}.tar.gz" -o archive.tar.gz
          curl -fsSL "https://github.com/yatoub/susshi/releases/download/${TAG}/susshi-linux-x86_64" -o susshi-linux-x86_64
          echo "src=$(b2sum archive.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "bin=$(b2sum susshi-linux-x86_64 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Patch PKGBUILD.bin
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          B2SUM_SRC: ${{ steps.checksums.outputs.src }}
          B2SUM_BIN: ${{ steps.checksums.outputs.bin }}
        run: |
          cp PKGBUILD.bin PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/^b2sums=(.*/b2sums=(${B2SUM_SRC})/" PKGBUILD
          sed -i "s/^b2sums_x86_64=(.*/b2sums_x86_64=(${B2SUM_BIN})/" PKGBUILD

      - name: Push to AUR
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050  # v4.2.0
        with:
          pkgname: susshi-bin
          pkgbuild: ./PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "chore: update to ${{ steps.ver.outputs.tag }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519
          allow_empty_commits: false

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          github-token: ${{ github.token }}
          title: "AUR publish (susshi-bin) failed for ${{ steps.ver.outputs.tag || 'unknown' }}"
          body: "aur-bin failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ── Smoke test: susshi-bin install from AUR ───────────────────────────────

  smoke-test-aur-bin:
    name: Smoke test — AUR susshi-bin install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [aur-bin]
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install susshi-bin from AUR (retry for AUR propagation delay)
        run: |
          cat > smoke-test.sh <<'SCRIPT'
          set -e
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel git
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          su - builder -c '
            set -e
            git clone https://aur.archlinux.org/susshi-bin.git /home/builder/susshi-bin
            cd /home/builder/susshi-bin
            makepkg -si --noconfirm
            susshi --version
          '
          SCRIPT

          for attempt in 1 2 3 4 5; do
            if docker run --rm \
                -v "${{ github.workspace }}/smoke-test.sh:/smoke-test.sh:ro" \
                archlinux:base-devel \
                bash /smoke-test.sh; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 60s..."
            sleep 60
          done
          echo "::error::susshi-bin failed to install from AUR after 5 attempts"
          exit 1

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          github-token: ${{ github.token }}
          title: "AUR susshi-bin smoke test failed for ${{ github.event.inputs.tag }}"
          body: "A fresh 'makepkg -si' for susshi-bin from AUR failed for ${{ github.event.inputs.tag }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
