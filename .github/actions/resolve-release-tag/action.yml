name: Resolve release tag
description: >
  Validates the version tag to publish (an explicit workflow_dispatch
  input). Fails closed if it isn't a valid vX.Y.Z tag. Shared by
  aur-publish.yml's aur-source and aur-bin jobs.

inputs:
  input-tag:
    description: The workflow_dispatch "tag" input
    required: true

outputs:
  tag:
    description: Resolved tag (e.g. v0.12.0)
    value: ${{ steps.resolve.outputs.tag }}
  version:
    description: Resolved tag with the leading "v" stripped
    value: ${{ steps.resolve.outputs.version }}

runs:
  using: composite
  steps:
    - name: Resolve version to publish
      id: resolve
      shell: bash
      env:
        INPUT_TAG: ${{ inputs.input-tag }}
      run: |
        TAG="$INPUT_TAG"
        if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
          echo "Invalid tag format: $TAG" >&2
          exit 1
        fi
        echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
