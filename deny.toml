[graph]
targets = []

[advisories]
version = 2
yanked = "deny"
ignore = [
    # basic-toml unmaintained — pulled by i18n-config (latest 0.4.8), only used at
    # compile time by the `fl!` macro to read i18n.toml. No upgrade available upstream.
    { id = "RUSTSEC-2026-0374", reason = "build-time only via i18n-config, no upstream fix" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
