[graph]
targets = []

[advisories]
version = 2
yanked = "deny"
ignore = [
    # unsafe-libyaml (pulled in by serde_yaml_ng) is archived upstream and has
    # no fixed release. "Unmaintained" advisory, not a known vulnerability.
    # Remove once the YAML parser is migrated to a safe Rust implementation.
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained via serde_yaml_ng; YAML parser migration planned" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
